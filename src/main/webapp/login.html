<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorDePrazo - Login</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="login-page">
    <section class="login-box" aria-label="Acesso ao sistema">
        <div class="login-brand-col">
            <img src="img/logo.png" alt="GestorDePrazo" class="login-logo-img">
        </div>

        <div class="login-form-col">
            <h1>Login</h1>
            <p class="login-subtitle">Digite seu e-mail e senha.</p>

            <form action="login" method="post" class="login-form" data-loading-text="Entrando...">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autofocus>
                </div>

                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-primary login-submit">Entrar</button>
            </form>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
